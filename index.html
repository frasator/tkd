  <script>
    function sleepRAF(ms) {
      return new Promise(resolve => {
        const start = performance.now()
        function check(now) {
          if (now - start >= ms) {
            resolve()
          } else {
            requestAnimationFrame(check)
          }
        }
        requestAnimationFrame(check)
      })
    }
    function forEachTecnica(fn) {
      for (let tipo in tecnicas) {
        for (let cinto in tecnicas[tipo]) {
          for (let i = 0; i < tecnicas[tipo][cinto].length; i++) {
            let tecnica = tecnicas[tipo][cinto][i]
            fn(tecnica)
          }
        }
      }
    }
    var audioMap = {}
    forEachTecnica((tecnica) => {
      let aux = tecnica.replace(/ /g, '-')
      var audio = new Audio(`sound/${aux}.mp3`)
      audio.onloadedmetadata = () => {
        audioMap[tecnica] = audio
      }
      audio.onerror = (e) => {
        console.log(`${aux}.mp3`)
      }
    })
    var silencioAudio = new Audio(`sound/silencio.mp3`)
    silencioAudio.onloadedmetadata = () => {
      audioMap['silencio'] = silencioAudio
    }
  </script>

    function reset() {
      toggleImage(false)
      todas = [];
      sogui = [];
      maki = [];
      gongkiok = [];
      pum = [];
      chagui = [];

      preguntado = {

        maki: {},
        gongkiok: {},
        pum: {},
        chagui: {}
      };

      preguntadoDiv.innerHTML = ""
    }

    let savedTIME = parseInt(localStorage.getItem('TIME'))
    window.TIME = isNaN(savedTIME) ? 10000 : savedTIME
    timeBtn.addEventListener('click', (e) => {
      let resultado = window.prompt("Intervalo de tiempo entre técnicas (segundos)", window.TIME / 1000)

        const parsedTIME = parseFloat(resultado)
        if (!isNaN(parsedTIME)) {
          window.TIME = parsedTIME * 1000
          localStorage.setItem('TIME', window.TIME)
          location.reload()
        }
      }
    })


    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1) + min);
    }

    var cinturonPorTecnica = {}
    for (let cituron in tecnicas) {
      for (let tipo in tecnicas[cituron]) {
        for (let i = 0; i < tecnicas[cituron][tipo].length; i++) {
          let tecnica = tecnicas[cituron][tipo][i]
          cinturonPorTecnica[tecnica] = cituron
        }
      }
    }
    function getTecnicaHTML(tecnica) {
      return `<span class="icono-cinturon ${cinturonPorTecnica[tecnica]}"></span> ${tecnica}`
    }

    var sogui, maki, gongkiok, pum, chagui, todas;
    function prepararTecnicas(cinturon) {
      setCookie('cinturon', cinturon)
      window['lastCinturon'] = cinturon;
      document.querySelector('#imgcinto').setAttribute('fill', colores[cinturon][1]);
      document.querySelector('.subsvgizq').setAttribute('fill', colores[cinturon][0]);
      document.querySelector('.subsvgder').setAttribute('fill', colores[cinturon][0]);
      document.querySelector('.subsvgstroke').setAttribute('stroke', "#000000");
      if (cinturon.indexOf("dan") != -1) {
        document.querySelector('.subsvgstroke').setAttribute('stroke', "gold");
      }
      document.querySelector('#cintosel').innerHTML = cinturon.replace("-", " ");
      reset();
      var acc = acumulativo[cinturon];
      for (var i = 0; i < acc.length; i++) {
        var color = acc[i];
        sogui = sogui.concat(tecnicas[color]["sogui"]);
        maki = maki.concat(tecnicas[color]["maki"]);
        gongkiok = gongkiok.concat(tecnicas[color]["gongkiok"]);
        pum = pum.concat(tecnicas[color]["pum"]);
        chagui = chagui.concat(tecnicas[color]["chagui"]);

      }
      todas = todas.concat(sogui);
      todas = todas.concat(maki);
      todas = todas.concat(gongkiok);
      todas = todas.concat(pum);
      todas = todas.concat(chagui);
      pintarPreguntado();

    }


    function rng(tecnica, isRandom = true) {
      // Verificamos que existan los datos necesarios
      if (!window[tecnica] || !preguntado[tecnica]) return "";

      const arr = window[tecnica];
      const yaPreguntados = Object.keys(preguntado[tecnica]);

      // Si ya completamos todos, cortamos de inmediato
      if (yaPreguntados.length >= arr.length) {
        return `${tecnica} completo`
      }

      let seleccionado;

      if (isRandom) {
        // --- Lógica Aleatoria (Segura, sin recursión) ---
        const pendientes = arr.filter(item => !preguntado[tecnica].hasOwnProperty(item));
        const idxRandom = Math.floor(Math.random() * pendientes.length);
        seleccionado = pendientes[idxRandom];
      } else {
        // --- Lógica Secuencial ---
        seleccionado = arr[yaPreguntados.length];
      }

      // Registrar y retornar
      preguntado[tecnica][seleccionado] = true;
      return seleccionado
    }

    img.addEventListener('click', (e) => {
      clearImage()
    })
    function clearImage(tecnica) {
      img.setAttribute('src', 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=')
      img.setAttribute('alt', '')
      img.classList.add('none')
    }
    function setImage(tecnica) {
      if (tecnica != '' && !/completo/gi.test(tecnica) && !/todas/gi.test(tecnica)) {
        var imgName = tecnica.replace(/ /g, '-')
        const imageURL = `./images/${imgName}.png`
        img.setAttribute('src', imageURL)
        img.setAttribute('alt', `${tecnica}`)
        img.classList.remove('none')
      }
    }
    function toggleImage(bool) {
      const tecnica = preguntaDiv.innerText.trim()
      if (tecnica != '' && !/completo/gi.test(tecnica) && !/todas/gi.test(tecnica)) {
        setImage(tecnica)
        if (bool == false) {
          clearImage()
        }
      } else {
        clearImage()
      }
    }
    mostrarBtn.addEventListener('click', (e) => {
      toggleImage()
    })

    /* USE API TEST*/
    for (var i = 0; i < tecEls.length; i++) {
      var tecEl = tecEls[i];
      tecEl.addEventListener('click', async (e) => {
        var el = e.currentTarget;
        let rngTecnica = rng(el.dataset.tecnica)
        preguntaDiv.innerHTML = getTecnicaHTML(rngTecnica)
        clearImage()
        let audio = await getAudio(rngTecnica)
        if (audio != null) {
          audio.play()
        }
        pintarPreguntado()
      })
    }

    function generar(tecnica) {
      var notDone = true;
      while (notDone) {
        var nuevaTecnica = rng(tecnica, false) // con false no es aleatorio
        preguntaDiv.innerHTML = getTecnicaHTML(nuevaTecnica)
        clearImage()
        pintarPreguntado()
        if (nuevaTecnica.indexOf('completo') != -1) {
          notDone = false;
        }
      }
    }
    generarBtn.addEventListener('click', (e) => {
      prepararTecnicas(window['lastCinturon'])
      generar('sogui')
      generar('maki')
      generar('gongkiok')
      generar('pum')
      generar('chagui')
      preguntaDiv.innerHTML = 'Mostrando todas...'
      clearImage()
    })


    reiniciarEl.addEventListener('click', (e) => {
      // prepararTecnicas(window['lastCinturon']);
      location.reload()
    });

    function pintarPreguntado() {
      var str = "";
      for (var grupo in preguntado) {
        let countEl = document.querySelector(`#${grupo}Count`)
        countEl.innerHTML = `${Object.keys(preguntado[grupo]).length}/${window[grupo].length}`
        str += '<div class="tit-historia">';
        var tec = preguntado[grupo];
        for (var tecnica in tec) {
          str += `<div class='tec'>${getTecnicaHTML(tecnica)}</div>`
        }
        str += "</div>"
      }
      preguntadoDiv.innerHTML = str
      preguntadoDiv.querySelectorAll('.tec').forEach(tecEl => {

          const tecnica = e.target.innerText.trim()
          preguntaDiv.innerHTML = getTecnicaHTML(tecnica)
          setImage(tecnica)
          toggleImage(true)
        })
      })
    }

    function setCookie(cname, cvalue) {
      var d = new Date()
      d.setTime(d.getTime() + (3600 * 24 * 60 * 60 * 1000))
      var expires = "expires=" + d.toUTCString()
      document.cookie = cname + "=" + cvalue + ";" + expires + ";path=/"
    }

    function getCookie(cname) {
      var name = cname + "="
      var ca = document.cookie.split(';')
      for (var i = 0; i < ca.length; i++) {
        var c = ca[i]
        while (c.charAt(0) == ' ') {
          c = c.substring(1)
        }
        if (c.indexOf(name) == 0) {
          return c.substring(name.length, c.length)
        }
      }
      return ""
    }

    async function getAudio(tecnica) {
      if (tecnica.toLowerCase().indexOf('completo') == -1) {
        while (audioMap[tecnica] == null) {

        }
        return audioMap[tecnica]
      }
    }

    async function rngComboChagui() {
      let comboLength = randomInt(3, 4)
      let arr = window['chagui']
      let chaguis = []
      let idxmap = {}
      while (chaguis.length != comboLength) {
        var idx = randomInt(0, arr.length - 1)
        if (idxmap[idx] == null) {

          chaguis.push(window['chagui'][idx])

    }

    async function prepararFuente(audioCtx, url) {
      // 1. Obtener los datos del archivo
      const res = await fetch(url)
      const arrayBuffer = await res.arrayBuffer()

      // 2. Decodificar el audio a un buffer que el navegador entienda
      const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer)

      // 3. Crear la fuente y conectarla a los altavoces
      const fuente = audioCtx.createBufferSource()
      fuente.buffer = audioBuffer
      fuente.connect(audioCtx.destination)
      return { fuente, audioBuffer }
    }

    async function reproducirAudioTecnicas(listaTecnicas, onTecnicaReproducida = (tec) => { }) {
      // Para que reproduzca un audio y se active, es como si pulsamos en una tecnica suelta
      let audio = await getAudio('silencio')
      audio.play()

      // Inicializar contexto en el primer tap
      let audioCtx
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)()
      }
      if (audioCtx.state === 'suspended') {
        await audioCtx.resume()
      }

      // El punto de partida es el reloj interno del hardware
      let tiempoDeInicio = audioCtx.currentTime + 0.1; // Pequeño margen de seguridad

      for (let i = 0; i < listaTecnicas.length; i++) {
        const tec = listaTecnicas[i]
        let audio = await getAudio(tec)
        let silencio = await getAudio('silencio')
        if (audio) {
          const r = await prepararFuente(audioCtx, audio.src)
          const rs = await prepararFuente(audioCtx, silencio.src)

          rs.fuente.onended = async () => {
            preguntaDiv.innerHTML = getTecnicaHTML(tec)
            clearImage()
            pintarPreguntado()
            await onTecnicaReproducida(tec)
          }
          // Programamos el sonido en su momento exacto
          rs.fuente.start(tiempoDeInicio)
          r.fuente.start(tiempoDeInicio)

          // El siguiente sonido empezará cuando acabe este + el intervalo
          tiempoDeInicio += r.audioBuffer.duration + (window.TIME / 1000);
        }
      }
    }
